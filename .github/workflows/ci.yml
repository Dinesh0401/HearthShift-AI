name: HearthShift AI Release Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, Python Research, Security, Production & Static E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python research dependencies
        run: python -m pip install --upgrade pip && pip install -r research/requirements.txt

      - name: Production dependency security audit
        run: npm audit --omit=dev

      - name: TypeScript type-check
        run: npm run type-check

      - name: ESLint check
        run: npm run lint

      - name: Vitest unit & parity test suite
        run: npm run test

      - name: Python research & parity test suite
        run: pytest research/tests

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build standard Node production bundle
        run: npm run build

      - name: Run Playwright E2E suite against Next.js production server
        run: npm run test:e2e

      - name: Build static export bundle (Cloudflare Pages target)
        run: npm run build:static

      - name: Verify static export artifacts, headers, and zero secrets
        run: npm run verify:static

      - name: Run Playwright E2E suite against compiled static out/ bundle
        run: npm run test:e2e:static

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          retention-days: 7
